services:
  - type: web
    name: eproducts-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ADMIN_EMAIL
        value: admin@eproducts.com
      - key: FIREBASE_PROJECT_ID
        value: gomart-4615b
      - key: FIREBASE_STORAGE_BUCKET
        value: gomart-4615b.firebasestorage.app
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
